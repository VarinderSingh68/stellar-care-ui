name: Deploy to Serv00

# Builds the React frontend and uploads it together with the PHP API to a Serv00
# account over SFTP. Serv00 has no Git integration of its own, so this workflow
# is the "deploy from GitHub" path.
#
# One-time setup in the Serv00 panel (DevilWEB):
#   1. WWW websites -> add your domain/subdomain with Website type = PHP
#      (Serv00 only honours .htaccess on PHP-type websites).
#   2. SSL certificates -> request the free Let's Encrypt certificate.
#   3. Additional -> SSH keys -> paste the PUBLIC half of a key you generate.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST         e.g. s5.serv00.com (the server shown in the panel)
#   SSH_PORT         22
#   SSH_USERNAME     your Serv00 login
#   SSH_PRIVATE_KEY  the private key matching the one added in the panel
#   DEPLOY_PATH      /usr/home/<login>/domains/<domain>/public_html
#
# The site's API is same-origin, so VITE_API_URL is deliberately left unset:
# frontend/src/lib/config.ts falls back to window.location.origin.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: serv00-deploy
  cancel-in-progress: true

jobs:
  # Serv00 runs PHP 8.2 for this site (pinned in the .htaccess), so the port is
  # linted and smoke-tested on that exact version before anything is uploaded.
  php:
    name: PHP 8.2 checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint every PHP file
        run: |
          set -euo pipefail
          find backend-php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run the API smoke test
        run: php backend-php/scripts/smoke-test.php

  deploy:
    needs: php
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Assemble deployment folder
        run: |
          set -euo pipefail
          rm -rf deploy-out
          mkdir -p deploy-out/api

          # Static site
          cp -r frontend/dist/. deploy-out/

          # PHP API (scripts and the dev router stay in the repository)
          cp -r backend-php/. deploy-out/api/
          rm -rf deploy-out/api/scripts deploy-out/api/router.php deploy-out/api/config.example.php

          # Serv00/Apache configuration for the site root
          cp deploy/serv00/public_html/.htaccess deploy-out/.htaccess

          # A real config.php must never be committed or shipped: it holds the
          # Resend key and the session secret, and lives only on the server.
          rm -f deploy-out/api/config.php

      - name: Upload to Serv00 over SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy-out/*"
          target: ${{ secrets.DEPLOY_PATH }}
          # Strip the deploy-out/ prefix so the files land directly in public_html.
          strip_components: 1
          overwrite: true
