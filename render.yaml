services:
  - type: web
    name: stellar-care-api
    env: node
    plan: free
    buildCommand: npm install --include=dev
    startCommand: node email-server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false

  - type: static
    name: stellar-care-ui
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://stellar-care-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
