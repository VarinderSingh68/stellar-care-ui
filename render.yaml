services:
  - type: web
    name: dr-rana-dental-api
    runtime: node
    # NOTE: persistent Disks (below) are not available on Render's free
    # plan -- this must be a paid instance type for patient/appointment
    # data to survive a redeploy or restart.
    plan: starter
    # Commands run from rootDir, and files outside it (e.g. ../env) are not
    # available on Render -- env vars come from envVars below / the dashboard.
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.cjs
    disk:
      name: clinic-data
      mountPath: /var/data
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: WATI_API_ENDPOINT
        sync: false
      - key: WATI_ACCESS_TOKEN
        sync: false

  - type: static
    name: dr-rana-dental-ui
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    # Relative to rootDir, i.e. frontend/dist.
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://dr-rana-dental-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
