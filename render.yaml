services:
  - type: web
    name: dr-rana-dental-api
    env: node
    # NOTE: persistent Disks (below) are not available on Render's free
    # plan -- this must be a paid instance type for patient/appointment
    # data to survive a redeploy or restart.
    plan: starter
    buildCommand: npm install --include=dev
    startCommand: node email-server.cjs
    disk:
      name: clinic-data
      mountPath: /var/data
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: WATI_API_ENDPOINT
        sync: false
      - key: WATI_ACCESS_TOKEN
        sync: false

  - type: static
    name: dr-rana-dental-ui
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://dr-rana-dental-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
